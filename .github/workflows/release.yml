name: Release build srpm
permissions:
  contents: write
on:
  release:
    types: [released]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Tools
        run: dnf -y install rpkg wget
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build SRPM
        run: |
          bin_version=$(awk -F':' '/^Version/ {gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2}' trzsz.spec)
          wget -q https://github.com/trzsz/trzsz-go/archive/refs/tags/v${bin_version}.tar.gz
          tar -xzf v${bin_version}.tar.gz
          cd trzsz-go-${bin_version} && go mod vendor && cd ..
          rm -f v${bin_version}.tar.gz
          tar -czf v${bin_version}.tar.gz trzsz-go-${bin_version}/
          mkdir -p build
          cp *.spec build/
          rpkg srpm --outdir ./build
      - name: Show Checksum
        run: sha256sum ./build/*.src.rpm
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./build/*.src.rpm
            ./v*.tar.gz
