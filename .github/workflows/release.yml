name: Release build srpm
permissions:
  contents: write
on:
  release:
    types: [released]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Tools
        run: dnf -y install rpkg
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build SRPM
        run: |
          version=${GITHUB_REF#refs/tags/v}
          bin_version=${version%-*}
          tar -xzf v${bin_version}.tar.gz
          cd trzsz-go-${bin_version} && go mod vendor && cd ..
          rm -f v${bin_version}.tar.gz
          tar -czf v${bin_version}.tar.gz trzsz-go-${bin_version}/
          mkdir -p build
          cp *.spec build/
          rpkg srpm --outdir ./build
      - name: Show Checksum
        run: sha256sum ./build/*.src.rpm
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./build/*.src.rpm
